# Application keybindings. Set one or more chords used to leave terminal focus.
keybindings:
  leaveTerminalFocus: ["Ctrl+Alt+]"]

# Status detection settings.
#
# interactiveCommands: programs where terminal output changes are user-driven
# (scrolling, status bars, etc.) and should not trigger working/idle transitions.
# Set this to replace defaults entirely, or use extraInteractiveCommands to add
# to the defaults without replacing them.
#
# Default interactive commands:
#   nvim, vim, vi, nano, helix, hx, emacs, emacsclient, less, more, man,
#   htop, btop, top, watch, lazygit, lazydocker, ranger, nnn, lf, yazi, tmux
status:
  # Replace the default list entirely:
  # interactiveCommands:
  #   - nvim
  #   - vim
  #   - my-custom-editor
  #
  # Or extend the defaults with additional commands:
  # extraInteractiveCommands:
  #   - my-custom-editor
  #   - my-other-tool
  #
  # Ordered custom rules override built-in inference when every supplied match
  # field matches. displayName, command, and lastLine are JavaScript regexes;
  # projectId and runtimeId are exact strings. lastLine is the current screen's
  # last non-empty line, not a historical scrollback search. First match wins.
  # Rules are trusted local configuration: keep them narrow because they may
  # intentionally override built-in attention or error evidence. Restart after
  # changing them.
  #
  # rules:
  #   - id: polling-worker-waiting
  #     match:
  #       runtimeId: shell
  #       command: '^python3$'
  #       lastLine: '^No work for [^;]+; checking again in [0-9]+s\.$'
  #     set:
  #       status: idle
  #
  # Outcomes: idle, working, attention, or error. Non-idle outcomes may add:
  #       activityText: Waiting for approval
  #       activityTool: terminal

  #
  # Named prompt signatures are ordered runtime-scoped all-of regexes. Each
  # signature needs a unique id, a supported runtime (claude, codex, opencode,
  # or omp), and at least two distinct patterns; every pattern must match a
  # normalised line in the currently visible pane, never scrollback. Empty-text,
  # backreference, lookaround, and ambiguous nested-repeat patterns are rejected.
  # Add machine-specific signatures in config.local.yaml with
  # extraPromptSignatures so the base promptSignatures list is not replaced.
  # Native approval, question, error, and active detection takes precedence.
  #
  # promptSignatures:
  #   - id: custom-codex-footer
  #     runtime: codex
  #     all:
  #       - '^›(?:\s|$)'
  #       - '^[^·]{1,80} · (?:~/|/).+$'
  #
  # Calibration writes only status.extraPromptSignatures:
  #   arcane-agents status learn-prompt "Worker" --runtime claude

# Audio playback settings.
audio:
  enableSound: true

# Avatar selection settings.
# Disabled avatars remain available when explicitly pinned on a shortcut,
# but are excluded from random avatar allocation.
avatars:
  disabled: []
  # - minotaur-strategist
  # - gothic-witch

# Backend runtime settings.
backend:
  tmux:
    socketName: arcane-agents
    sessionName: arcane-agents
    pollIntervalMs: 2500

# Server bind settings.
server:
  host: 127.0.0.1
  port: 7600
